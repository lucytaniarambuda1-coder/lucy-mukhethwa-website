name: Check Substack for new posts
# Once a day, re-read Lucy's Substack feed. If there is a new post, commit the
# updated post list; that push makes Netlify rebuild the site with the new post.
on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 South Africa time
  workflow_dispatch:       # "Run workflow" button on GitHub for an instant check
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/generate.py
      - name: Commit if the post list changed
        run: |
          if git diff --quiet -- tools/substack_cache.json; then
            echo "No new Substack posts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/substack_cache.json
            git commit -m "New Substack post"
            git push
          fi
